# Nine certificates and courses (DSI-94, migrated to a collection by DSI-98).
# Dates read off the certificate files or the issuer's own verification page —
# see docs/wiki/education-and-credentials.md for provenance per entry. The
# three Anthropic certificates print no date at all; those dates are the
# owner's.
#
# `image` is one of two things. With no `href`, it is page 1 of the
# certificate, rendered from private/ by scripts/render-certs.py, and the card
# opens it in a viewer. With an `href`, it is the preview the issuer's
# verification page publishes, and the card links out to that page.

