icpat-19:
  order: 2
  kind: publication
  title: "Design and Analysis of Thermal Comfort of a Naturally Ventilated Recreational Vehicle"
  venue: "International Journal of Energy, Environment and Economics — presented at ICPAT-19"
  href: "https://www.researchgate.net/publication/334469078_Analysis_of_Thermal_Comfort_of_a_naturally_ventilated_Recreational_Vehicle"
  abstract: >-
    We have designed a Recreational vehicle suited to the varying climatic conditions of India,
    with minimal HVAC loads but without having to compromise the thermal comfort and well-being
    of the occupants. We show that by altering the orientation, fabric, and glazing ratio, it is
    possible to substantially reduce energy consumption in these vehicles using sophisticated
    energy modelling software. We illustrate the complex interplay between the carrier fluids and
    obstructing structures within it and explain patterns of ventilation in shear generated
    turbulence. It is expected that this first design study on an RV, anywhere within the
    sub-continent, will garner attention from manufacturers linked to the tourism industry. We
    show that the designed vehicle will approximately consume only 25% of the energy consumed by
    its counterpart hotel rooms.
